# Builds the package and runs the tests on every push to main and every pull request.
# The tests need no client and no server: where they start pbs-mackup-run, it is the debug build
# in a private folder with a stand-in client. The ones that take APFS snapshots stay off
# (PBS_MACKUP_SNAPSHOT_TESTS), because they need Full Disk Access.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The same image as the release, so the tests run on the macOS version the app asks for.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build
      # The tests take seconds. A step that is still running after 4 minutes is stuck, and the
      # step after it says where (a stuck run is otherwise only cut off at the end of the job).
      - run: swift test 2>&1 | tee test.log
        shell: bash
        timeout-minutes: 4
      - name: Show where a stuck test waits
        if: failure() || cancelled()
        shell: bash
        run: |
          echo "--- last tests started"; grep -E "started\.|passed|failed" test.log | tail -15 || true
          echo "--- processes"; ps -axo pid,ppid,etime,stat,command | grep -E "swift|xctest|proxmox|pbs-mackup|sleep|/bin/sh" | grep -v grep
          for pid in $(pgrep -f "swiftpm-testing-helper|xctest|proxmox-backup-client|pbs-mackup-run" || true); do
            echo "--- sample $pid"; sample "$pid" 2 -file /dev/stdout 2>&1 | grep -vE "deduplicated_symbol|\(in Testing\)|libswift_Concurrency|TaskLocal" | head -120 || true
          done
